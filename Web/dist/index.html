<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Watch</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><a class="brand" href="/">watch</a><nav aria-label="Library"></nav><input id="search" type="search" placeholder="Search library" aria-label="Search your library"><button id="refresh">Refresh Firefox</button></header>
<main>
<p id="status" role="status">Loading your library…</p><section id="feed" aria-label="Bookmarks"></section><footer id="pagination"></footer></main>
<template id="card"><article><div class="media"></div><div class="details"><div class="heading"><button class="title"></button><a class="original" target="_blank" rel="noopener" aria-label="Open original">↗</a></div><div class="actions"></div></div></article></template>
<script src="/app.js" defer></script></body></html>
